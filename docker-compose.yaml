services:
  ollama:
    volumes:
      - ./volumes/rw/ollama:/root/.ollama
    entrypoint: ["/root/.ollama/entrypoint.sh"]
    command: []
    container_name: dirtclod-ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: docker.io/ollama/ollama:latest
    ports:
      - ${OLLAMA_PUBLIC_PORT:-11434}:11434
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_LOAD_TIMEOUT=60s
    networks:
      - dirtclod-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all 
              capabilities: [gpu]

  ollama-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: dirtclod-ollama-webui
    depends_on:
      - ollama
    ports:
      - 8080:8080
    environment: # https://docs.openwebui.com/getting-started/env-configuration#default_models
      - OLLAMA_BASE_URLS=http://host.docker.internal:${OLLAMA_PUBLIC_PORT:-11434} #comma separated ollama hosts
      - ENV=dev
      - WEBUI_AUTH=False
      - WEBUI_NAME=valiantlynx AI
      - WEBUI_URL=http://localhost:8080
      - WEBUI_SECRET_KEY=t0p-s3cr3t
      - NO_PROXY=host.docker.internal
    volumes:
      - ./volumes/rw/webui:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    networks:
      - dirtclod-net

  sshitmaids:
    image: ghcr.io/pxtl/sshitmaids:latest
    container_name: dirtclod-sshitmaids
    environment:
      - SSHITMAIDS_DEST=${SSHITMAIDS_DEST:-git@github.com:22}
      - SSHITMAIDS_PORT=${SSHITMAIDS_PORT:-2222}
      - SSHITMAIDS_GENERATE_CLIENT_CONFIG=${SSHITMAIDS_GENERATE_CLIENT_CONFIG:-false}
      - SSHITMAIDS_CLIENT_DEST=${SSHITMAIDS_CLIENT_DEST:-git@sshitmaids:22}
      - SSHITMAIDS_DO_KEYSCAN=${SSHITMAIDS_DO_KEYSCAN:-false}
    #debug
    read_only: false
    ports:
      - "$SSHITMAIDS_PORT:22"
    volumes:
      - ./volumes/ro/sshitmaids:/root/sshitmaids
      - ./volumes/ro/ssh-client:/root/ssh-client
    restart: unless-stopped
    networks:
      - dirtclod-net

  pi-coding-agent:
    build: ./pi-coding-agent-docker
    container_name: dirtclod-pi
    depends_on:
      - sshitmaids
    tty: true
    stdin_open: true
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - PARANOID_MODE=${PARANOID_MODE:-true}
      - GIT_AUTHOR_NAME=${GIT_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_EMAIL}
      - GIT_CONFIG_COUNT=2
      - GIT_CONFIG_KEY_0=user.signingkey
      - GIT_CONFIG_VALUE_0=${GIT_GPG_KEY}
      - GIT_CONFIG_KEY_1=commit.gpgsign
      - GIT_CONFIG_VALUE_1=${GIT_GPG_SIGN:-false}
    secrets:
      - source: github_token
        target: ${SECRET_TARGET_PATH:-/run/secrets/gh_default}
    volumes:
      - ./volumes/rw/workspace:/workspace
      - ./submodule/pi-coding-agent/.pi-data:/home/node/.pi
      - ./volumes/ro/ssh-client:/home/node/.ssh
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    #DEBUG
    # read_only: true
    tmpfs:
      - /tmp:noexec,nodev,nosuid,mode=1777
      - /home/node/.config:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid
      - /home/node/.npm:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid
    pids_limit: 150
    networks:
      - dirtclod-net
    restart: unless-stopped

networks:
  dirtclod-net:
    driver: bridge

secrets:
  github_token:
    file: ${PWD}/submodule/pi-coding-agent/.secrets/github_token.txt