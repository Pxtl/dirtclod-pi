services:
  llama-agent:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: dirtclod-llama-agent
    pull_policy: always
    restart: unless-stopped
    tty: true
    volumes:
      - ./volumes/llama:/models
    environment:
      # Where -hf downloads are cached (persisted in ./volumes/llama)
      - LLAMA_CACHE=/models
      - HF_TOKEN=${HF_TOKEN:-}
      # HuggingFace repo:quant for the agent model. Pick per your VRAM, see
      # .env.example.  llama.cpp default quant is Q4_K_M.
      - LLAMA_ARG_HF_REPO=${LLM_AGENT_HF_REPO:-VladimirGav/qwen3.8-27B-14GB-IQ4:IQ4}
      - LLAMA_ARG_CTX_SIZE=${LLM_AGENT_CTX:-65536}
      - LLAMA_ARG_N_GPU_LAYERS=all
      - LLAMA_ARG_FLASH_ATTN=on
      # q8_0 KV cache halves KV memory, same as the old OLLAMA_KV_CACHE_TYPE
      - LLAMA_ARG_CACHE_TYPE_K=q8_0
      - LLAMA_ARG_CACHE_TYPE_V=q8_0
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
    ports:
      - ${LLAMA_AGENT_PUBLIC_PORT:-9090}:8080
    devices:
      # needed for podman passthrough of GPU
      - "nvidia.com/gpu=all"
    # Disables restrictive labels so the container can access the GPU nodes
    security_opt:
      # needed for podman passthrough of GPU
      - label=disable
    networks:
      - dirtclod-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 24G

  llama-autocomplete:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: dirtclod-llama-autocomplete
    pull_policy: always
    restart: unless-stopped
    tty: true
    volumes:
      - ./volumes/llama:/models
    environment:
      - LLAMA_CACHE=/models
      - HF_TOKEN=${HF_TOKEN:-}
      - LLAMA_ARG_HF_REPO=${LLM_AUTOCOMPLETE_HF_REPO:-Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M}
      - LLAMA_ARG_CTX_SIZE=8192
      - LLAMA_ARG_N_GPU_LAYERS=all
      - LLAMA_ARG_FLASH_ATTN=on
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8081
    ports:
      - ${LLAMA_AUTOCOMPLETE_PUBLIC_PORT:-8081}:8081
    devices:
      - "nvidia.com/gpu=all"
    security_opt:
      - label=disable
    networks:
      - dirtclod-net
    deploy:
      resources:
        limits:
          memory: 4G
  webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: dirtclod-webui
    depends_on:
      - llama-agent
    ports:
      - 8080:8080
    environment: # https://docs.openwebui.com/getting-started/env-configuration#default_models
      - OPENAI_API_BASE_URL=http://llama-agent:8080/v1
      - OPENAI_API_KEY=sk-dirtclod-local
      - ENABLE_PERSISTENT_CONFIG=${ENABLE_PERSISTENT_CONFIG:-false}
      - ENV=dev
      - WEBUI_AUTH=False
      - WEBUI_NAME=valiantlynx AI
      - WEBUI_URL=http://localhost:8080
      - WEBUI_SECRET_KEY=t0p-s3cr3t
      - NO_PROXY=host.docker.internal
    volumes:
      - ./volumes/webui:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    networks:
      - dirtclod-net

  sshitmaids:
    image: ghcr.io/pxtl/sshitmaids:latest
    container_name: dirtclod-sshitmaids
    environment:
      - SSHITMAIDS_DEST=${SSHITMAIDS_DEST:-git@github.com:22}
      - GENERATE_CLIENT_CONFIG=${SSHITMAIDS_GENERATE_CLIENT_CONFIG:-true}
      - CLIENT_DEST=${SSHITMAIDS_CLIENT_DEST:-git@sshitmaids:22}
      - DO_KEYSCAN=${SSHITMAIDS_DO_KEYSCAN:-false}
    #debug
    read_only: false
    ports:
      - "${SSHITMAIDS_PUBLIC_PORT:-2222}:22"
    volumes:
      - ./volumes/sshitmaids:/root/sshitmaids
      - ./volumes/ssh-client:/root/ssh-client
    restart: unless-stopped
    networks:
      - dirtclod-net

  pi-coding-agent:
    build: ./pi-coding-agent-docker
    container_name: dirtclod-pi
    depends_on:
      - sshitmaids
      - llama-agent
    tty: true
    stdin_open: true
    environment:
      - GIT_AUTHOR_NAME=${GIT_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_EMAIL}
      - GIT_CONFIG_COUNT=2
      - GIT_CONFIG_KEY_0=user.signingkey
      - GIT_CONFIG_VALUE_0=${GIT_GPG_KEY}
      - GIT_CONFIG_KEY_1=commit.gpgsign
      - GIT_CONFIG_VALUE_1=${GIT_GPG_SIGN:-false}
      # provider specific API keys, as many as practical included here so user
      # doesn't have to customize the docker-compose.  You can replace all of
      # these with only the ones you actually use
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - CO_API_KEY=${CO_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GREENPT_API_KEY=${GREENPT_API_KEY:-}

    volumes:
      - ./volumes/workspace:/workspace
      - ./volumes/pi-coding-agent/.pi-data:/home/agentclod/.pi
      - ./volumes/pi-coding-agent/.config:/home/agentclod/.config
      - ./volumes/pi-coding-agent/.npm:/home/agentclod/.npm
      - ./volumes/pi-coding-agent/.ssh:/home/agentclod/.ssh
    user: "${AGENT_UID:-1000}:${AGENT_GID:-1000}"
    #DEBUG
    # read_only: true
    tmpfs:
      - /tmp:noexec,nodev,nosuid,mode=1777
    networks:
      - dirtclod-net
    restart: unless-stopped

networks:
  dirtclod-net:
    driver: bridge