services:
  ollama:
    volumes:
      - ./volumes/ollama:/root/.ollama
    entrypoint: ["/root/.ollama/entrypoint.sh"]
    command: []
    container_name: dirtclod-ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: docker.io/ollama/ollama:latest
    ports:
      - ${OLLAMA_PUBLIC_PORT:-11434}:11434
    environment:
      - OLLAMA_DEBUG=1
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_LOAD_TIMEOUT=60s
      # reserve bytes of GPU for OS
      - OLLAMA_GPU_OVERHEAD=536870912
    networks:
      - dirtclod-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all 
              capabilities: [gpu]
        limits:
          memory: 24G

  ollama-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: dirtclod-ollama-webui
    depends_on:
      - ollama
    ports:
      - 8080:8080
    environment: # https://docs.openwebui.com/getting-started/env-configuration#default_models
      - OLLAMA_BASE_URLS=http://host.docker.internal:${OLLAMA_PUBLIC_PORT:-11434} # comma separated ollama hosts
      - ENV=dev
      - WEBUI_AUTH=False
      - WEBUI_NAME=valiantlynx AI
      - WEBUI_URL=http://localhost:8080
      - WEBUI_SECRET_KEY=t0p-s3cr3t
      - NO_PROXY=host.docker.internal
    volumes:
      - ./volumes/webui:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    networks:
      - dirtclod-net

  sshitmaids:
    image: ghcr.io/pxtl/sshitmaids:latest
    container_name: dirtclod-sshitmaids
    environment:
      - SSHITMAIDS_DEST=${SSHITMAIDS_DEST:-git@github.com:22}
      - GENERATE_CLIENT_CONFIG=${SSHITMAIDS_GENERATE_CLIENT_CONFIG:-true}
      - CLIENT_DEST=${SSHITMAIDS_CLIENT_DEST:-git@sshitmaids:22}
      - DO_KEYSCAN=${SSHITMAIDS_DO_KEYSCAN:-false}
    #debug
    read_only: false
    ports:
      - "${SSHITMAIDS_PUBLIC_PORT:-2222}:22"
    volumes:
      - ./volumes/sshitmaids:/root/sshitmaids
      - ./volumes/ssh-client:/root/ssh-client
    restart: unless-stopped
    networks:
      - dirtclod-net

  pi-coding-agent:
    build: ./pi-coding-agent-docker
    container_name: dirtclod-pi
    depends_on:
      - sshitmaids
    tty: true
    stdin_open: true
    environment:
      - GIT_AUTHOR_NAME=${GIT_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_EMAIL}
      - GIT_CONFIG_COUNT=2
      - GIT_CONFIG_KEY_0=user.signingkey
      - GIT_CONFIG_VALUE_0=${GIT_GPG_KEY}
      - GIT_CONFIG_KEY_1=commit.gpgsign
      - GIT_CONFIG_VALUE_1=${GIT_GPG_SIGN:-false}
    secrets:
      - source: github_token
        target: ${SECRET_TARGET_PATH:-/run/secrets/gh_default}
    volumes:
      - ./volumes/workspace:/workspace
      - ./volumes/pi-coding-agent/.pi-data:/home/agentclod/.pi
      - ./volumes/pi-coding-agent/.config:/home/agentclod/.config
      - ./volumes/pi-coding-agent/.npm:/home/agentclod/.npm
      - ./volumes/pi-coding-agent/.ssh:/home/agentclod/.ssh
    user: "${AGENT_UID:-1000}:${AGENT_GID:-1000}"
    #DEBUG
    # read_only: true
    tmpfs:
      - /tmp:noexec,nodev,nosuid,mode=1777
    networks:
      - dirtclod-net
    restart: unless-stopped

networks:
  dirtclod-net:
    driver: bridge

secrets:
  github_token:
    file: ${PWD}/volumes/pi-coding-agent/.secrets/github_token.txt
