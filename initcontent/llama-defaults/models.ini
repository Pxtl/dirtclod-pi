version = 1

; Global defaults for every model instance.
; n-gpu-layers=auto lets llama.cpp fit layers to free VRAM and offload the
; overflow to CPU instead of hard-failing.
; Letter-style note: these are llama.cpp long-arg names, not chmod perms.
[*]
n-gpu-layers = auto
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0

; Main coding agent. Qwen3.8-27B dense; full-GPU at IQ4_XS (~14.3GB).
; 64k ctx fits ONLY with q4_0 KV cache (KV q8_0 at 64k needs ~3GB and
; pushes total past the ~19GB free on the 12+8GB cards).  q4_0 KV with
; flash-attn is the standard trick; quality cost is minor for agent use.
; If you prefer q8_0 KV, drop ctx to ~49152.
[dirtclod-agent-qwen]
; tuned on the live box (12GB+8GB cards, 8GB hosts the desktop):
;   - tensor-split 1,2 = 8GB:33% / 12GB:67% of weights (matching free VRAM)
;   - n-gpu-layers 64 = all layers for this model; 999 OOMs at this ctx
;   - cache q5_1 = best KV tier below q8_0, which would force ctx way down
;   - if tuning further: q8_0 KV at ~50k ctx is the quality-max alternative
[dirtclod-agent-qwen]
tensor-split = 1,2
n-gpu-layers = 64
cache-type-k = q5_1
cache-type-v = q5_1
c = 57344
hf-repo = unsloth/Qwen3.8-27B-GGUF
hf-file = Qwen3.8-27B-UD-IQ4_XS.gguf
[dirtclod-north-mini-code]
hf-repo = unsloth/North-Mini-Code-1.0-GGUF
hf-file = North-Mini-Code-1.0-UD-Q5_K_M.gguf
c = 65536
n-cpu-moe = 999

; Small autocomplete model, always resident.
[dirtclod-autocomplete-qwen]
hf-repo = Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF
hf-file = qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
c = 8192
load-on-startup = true
